on:
  pull_request:
    branches:
      - release
  push:
    branches:
      - release
name: "Build & Release"
jobs:
  build:
    name: 🛠️ Build & Release
    # runs-on: macos-latest
    runs-on: ubuntu-latest
    steps:
#CREATE SECRETS
        # name: CREATE SECRETS
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v2
        with:
          distribution: 'zulu'
          java-version: '17'
#INIT DEVENDENCIES  ss
      # - name: INIT DEVENDENCIES 
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64
          flutter-version: '3.35.6'        
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
   #   - run: flutter test
#ANDROID
      # - run: flutter build apk --split-per-abi
      - run: flutter build apk --release
#IOS
      # - run: flutter build ios --no-codesign
      # - run: mkdir build/ios/iphoneos/Payload
      # - run: cp -R build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload
      # - run: zip -r build/ios/iphoneos/app.ipa build/ios/iphoneos/Payload
# Add release
      - name: Push to Release
        uses: ncipollo/release-action@v1
        with:
        # build/app/outputs/apk/release/*,build/app/outputs/bundle/release/*,build/ios/iphoneos/app.ipa
          artifacts: "build/app/outputs/bundle/release/*" #",build/ios/iphoneos/app.ipa"
          tag: v${{ github.run_number }}     
          token: ${{ secrets.DEPLOYMENT }}
